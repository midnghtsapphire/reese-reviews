name: reese-reviews
region: nyc

services:
  - name: reese-reviews-web
    github:
      repo: MIDNGHTSAPPHIRE/reese-reviews
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # Secret values are managed in DigitalOcean App Platform / Doppler.
    # Do not commit real API keys or tokens here.
    envs:
      - key: VITE_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_OPENROUTER_API_KEY
        scope: BUILD_TIME
        type: SECRET
    routes:
      - path: /

domains:
  - domain: reesereviews.com
    type: PRIMARY
  - domain: www.reesereviews.com
    type: ALIAS
